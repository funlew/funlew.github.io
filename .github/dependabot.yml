version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 20
  ignore:
    # hexo-theme-icarus validates its dependencies against its own package.json
    # before generating and calls process.exit() when one does not satisfy the
    # range (themes/icarus/include/dependency.js). A version the theme does not
    # accept therefore aborts the build and the deployment, and the resulting
    # ERROR line in the log is easy to miss. Ignore only what would break it.
    #
    # The theme pins this one to an exact version, so semver.satisfies() rejects
    # even 0.8.1: nothing is safe to merge until the theme updates its own pin.
    - dependency-name: "bulma-stylus"
    #
    # Caret ranges below: patch and minor releases inside the range build fine,
    # only the next major release trips the check.
    - dependency-name: "hexo-pagination"
      versions: [">=4.0.0"]
    - dependency-name: "hexo-util"
      versions: [">=4.0.0"]
    - dependency-name: "inferno"
      versions: [">=9.0.0"]
    - dependency-name: "inferno-create-element"
      versions: [">=9.0.0"]
