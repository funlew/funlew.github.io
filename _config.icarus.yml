# Version of the configuration file
version: 5.1.0
# Icarus theme variant, can be "default" or "cyberpunk"
variant: default
# Path or URL to the website's logo
# Or use the "text" property to display text instead of an image
logo:
    text: funlew
# Page metadata configurations
head:
    # URL or path to the website's icon
    favicon: /_static/img/favicon.png
    # Open Graph metadata
    # https://hexo.io/docs/helpers.html#open-graph
    open_graph:
        # Page type (og:type) (optional)
        type: blog
    # URL or path to the website's RSS atom.xml
    rss: /atom.xml
# Page top navigation bar configurations
navbar:
    # Navigation menu items
    menu:
        主页: /
        归档: /archives
        分类: /categories
        标签: /tags
        关于: /about
    # Links to be shown on the right of the navigation bar.
    # "语言" is the UI language switch button (zh-CN <-> en), handled by
    # source/js/lang-switch.js. Remove it to get rid of the button.
    links:
        语言:
            icon: fas fa-language
            url: '#'
# Page footer configurations
footer:
    # Copyright text
    # The theme already prints "© <year> <author>" in the footer,
    # so this field is only for extra copyright notes.
    copyright: ''
    # Links to be shown on the right of the footer section.
    # The names become the tooltips of the icon buttons.
    links:
        Creative Commons:
            icon: fab fa-creative-commons
            url: https://creativecommons.org/licenses/by-nc-sa/4.0/
        GitHub:
            icon: fab fa-github
            url: https://github.com/funlew
        RSS:
            icon: fas fa-rss
            url: /atom.xml
# Article related configurations
article:
    # Code highlight settings
    highlight:
        # Code highlight themes
        # https://github.com/highlightjs/highlight.js/tree/master/src/styles
        theme: atom-one-light
        # Show copy code button
        clipboard: true
        # Default folding status of the code blocks. Can be "", "folded", "unfolded"
        fold: unfolded
    # Whether to show estimated article reading time
    readtime: true
    # Whether to show updated time. For "auto", shows article update time only when page.updated is set and it is different from page.date
    update_time: true
    # Article licensing block
    licenses:
        Creative Commons:
            icon: fab fa-creative-commons
            url: https://creativecommons.org/
        Attribution:
            icon: fab fa-creative-commons-by
            url: https://creativecommons.org/licenses/by/4.0/
# Search plugin configurations
# Insight is a client-side search engine that works with the content.json
# generated by the theme itself. No extra service or token required.
search:
    type: insight
    # Whether to include pages in the search results. Set to false so the search
    # covers articles, tags and categories only: standalone pages such as
    # /about/ are short and rarely what a reader is looking for, and the "about"
    # entry competes with real articles in the result list.
    index_pages: false
# Sidebar configurations.
# Please be noted that a sidebar is only visible when it has at least one widget
# With widgets in both sides, the theme renders a three-column layout.
sidebar:
    # Left sidebar configurations
    left:
        # Whether the sidebar sticks to the top when page scrolls
        sticky: true
    # Right sidebar configurations
    right:
        # Whether the sidebar sticks to the top when page scrolls
        sticky: true
# Sidebar widget configurations
# http://ppoffice.github.io/hexo-theme-icarus/categories/Widgets/
widgets:
    # Profile widget configurations
    -
        # Where should the widget be placed, left sidebar or right sidebar
        position: left
        type: profile
        # Author name
        author: funlew
        # Author title
        author_title: 'a wu！(‾◡◝) ！'
        # Author's current location
        location: 
        # URL or path to the avatar image
        avatar: https://github.com/funlew.png
        # Whether show the rounded avatar image
        avatar_rounded: true
        # Email address for the Gravatar
        gravatar: 
        # URL or path for the follow button
        follow_link: https://github.com/funlew
        # Links to be shown on the bottom of the profile widget.
        # "icon-sns-*" classes are inline brand icons defined in
        # source/css/social-icons.css (no external icon font needed).
        # Replace the URLs below with your own profile pages.
        social_links:
            GitHub:
                icon: fab fa-github
                url: https://github.com/funlew
            微博:
                icon: icon-sns icon-sns-weibo
                url: https://weibo.com/
            知乎:
                icon: icon-sns icon-sns-zhihu
                url: https://www.zhihu.com/
            微信公众号:
                icon: icon-sns icon-sns-wechat
                url: https://mp.weixin.qq.com/
            Discord:
                icon: icon-sns icon-sns-discord
                url: https://discord.com/
            Twitter:
                icon: icon-sns icon-sns-x
                url: https://twitter.com/
            掘金:
                icon: icon-sns icon-sns-juejin
                url: https://juejin.cn/
            豆瓣:
                icon: icon-sns icon-sns-douban
                url: https://www.douban.com/
            Facebook:
                icon: icon-sns icon-sns-facebook
                url: https://www.facebook.com/
            语雀:
                icon: icon-sns icon-sns-yuque
                url: https://www.yuque.com/
            小红书:
                icon: icon-sns icon-sns-xiaohongshu
                url: https://www.xiaohongshu.com/
            RSS:
                icon: fas fa-rss
                url: /atom.xml
    # Table of contents widget configurations
    # The TOC widget is only rendered on posts/pages when "toc: true" is set
    # in the site _config.yml, so it stays hidden by default to match the
    # three-column layout without a contents card.
    -
        # Where should the widget be placed, left sidebar or right sidebar
        position: left
        type: toc
        # Whether to show the index of each heading
        index: true
        # Whether to collapse sub-headings when they are out-of-view
        collapsed: true
        # Maximum level of headings to show (1-6)
        depth: 3
    # Categories widget configurations
    -
        # Where should the widget be placed, left sidebar or right sidebar
        position: left
        type: categories
        # Display order of the top level categories, the names must match the
        # Chinese category names in the post front-matter exactly. Names that
        # are not listed here are appended after the listed ones in their
        # default (name) order. The option is read by the widget component in
        # themes/icarus/layout/widget/categories.jsx, and the agreed order is
        # documented in docs/_publishing-guide.md.
        customOrder:
            - 网络安全
            - 日常随笔
    # Recommendation links widget configurations
    # A value that is a URL string is rendered as a single entry. A mapping
    # value becomes a second level heading, and its keys become the entries
    # nested under that heading (see themes/icarus/layout/widget/links.jsx).
    -
        # Where should the widget be placed, left sidebar or right sidebar
        position: left
        type: links
        # Names and URLs of the sites
        links:
            Icarus: https://ppoffice.github.io/hexo-theme-icarus/
            Gratisography: https://gratisography.com/
    # Recent posts widget configurations
    -
        # Where should the widget be placed, left sidebar or right sidebar
        position: right
        type: recent_posts
    # Archives widget configurations
    -
        # Where should the widget be placed, left sidebar or right sidebar
        position: right
        type: archives
    # Tags widget configurations
    -
        # Where should the widget be placed, left sidebar or right sidebar
        position: right
        type: tags
        # How to order tags. For example 'name' to order by name in ascending order, and '-length' to order by number of posts in each tags in descending order
        order_by: -length
        # Amount of tags to show. Will show all if not set.
        amount: 20
        # Whether to show tags count, i.e. number of posts in the tag.
        show_count: true
# Plugin configurations
# https://ppoffice.github.io/hexo-theme-icarus/categories/Plugins/
plugins:
    # Enable page startup animations
    animejs: true
    # Show the "back to top" button
    back_to_top: true
    # BuSuanZi site/page view counter
    # https://busuanzi.ibruce.info
    busuanzi: false
    # Enable the lightGallery and Justified Gallery plugins
    gallery: true
    # Enable the KaTeX math typesetting support
    # https://katex.org/
    katex: false
    # Enable the MathJax math typesetting support
    # https://www.mathjax.org/
    mathjax: false
    # Enable PJAX
    pjax: true
    # Show a progress bar at top of the page on loading
    progressbar: true
# CDN provider settings
# https://ppoffice.github.io/hexo-theme-icarus/Configuration/Theme/speed-up-your-site-with-custom-cdn/
providers:
    # Name or URL template of the JavaScript and/or stylesheet CDN provider
    cdn: jsdelivr
    # Name or URL template of the webfont CDN provider
    fontcdn: google
    # Name or URL of the fontawesome icon font CDN provider
    iconcdn: fontawesome
